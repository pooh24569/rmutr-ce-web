# ===================================================================
# ☕ SourceAFIS Matcher — Spring Boot Configuration
# ===================================================================
server.port=8090
spring.application.name=fingerprint-matcher

# Max request size (fingerprint images can be large)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# SourceAFIS match threshold (default: 40)
matcher.threshold=40

# Scanner DPI (U.are.U 4500 = 512 DPI)
matcher.scanner-dpi=512

# Logging
logging.level.th.ac.rmutr=DEBUG
